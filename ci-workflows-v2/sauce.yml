name: Sauce Labs

# Real-browser cloud runs on Sauce Labs (Windows/macOS Chrome, Edge, Firefox, WebKit) via saucectl.
# Tests run on Sauce VMs; the downloaded Extent report is then published from this runner to
# Jira / Zephyr / Slack / Email, so integration secrets never leave GitHub.
on:
  schedule:
    - cron: "30 21 * * 0" # Monday 03:00 IST, weekly
  workflow_dispatch:
    inputs:
      suite:
        description: saucectl suite name (blank = every suite in .sauce/config.yml)
        type: string
        default: ""

concurrency:
  group: sauce-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sauce:
    name: Sauce Labs cloud run
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Install saucectl
        run: npm install -g saucectl
      - name: Run on Sauce Labs and publish
        run: |
          if [ -n "${{ inputs.suite }}" ]; then
            node scripts/sauce-run.mjs --publish --config .sauce/config.yml --select-suite "${{ inputs.suite }}"
          else
            node scripts/sauce-run.mjs --publish --config .sauce/config.yml
          fi
        env:
          SAUCE_USERNAME: ${{ secrets.SAUCE_USERNAME }}
          SAUCE_ACCESS_KEY: ${{ secrets.SAUCE_ACCESS_KEY }}
          SAUCE_REGION: ${{ vars.SAUCE_REGION || 'eu-central-1' }}
          SAUCE_BUILD_NAME: "${{ github.workflow }} #${{ github.run_number }}"
          REPORT_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JIRA_ENABLED: ${{ vars.JIRA_ENABLED }}
          JIRA_BASE_URL: ${{ vars.JIRA_BASE_URL }}
          JIRA_PROJECT_KEY: ${{ vars.JIRA_PROJECT_KEY }}
          JIRA_ISSUE_KEY_PREFIXES: ${{ vars.JIRA_ISSUE_KEY_PREFIXES }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          ZEPHYR_ENABLED: ${{ vars.ZEPHYR_ENABLED }}
          ZEPHYR_PROJECT_KEY: ${{ vars.ZEPHYR_PROJECT_KEY }}
          ZEPHYR_BASE_URL: ${{ vars.ZEPHYR_BASE_URL }}
          ZEPHYR_TEST_CYCLE_NAME: "Sauce Labs run ${{ github.run_number }}"
          ZEPHYR_API_TOKEN: ${{ secrets.ZEPHYR_API_TOKEN }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_NOTIFY_ON: always
          EMAIL_ENABLED: ${{ vars.EMAIL_ENABLED }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          EMAIL_FROM: ${{ vars.EMAIL_FROM }}
          EMAIL_TO: ${{ vars.EMAIL_TO }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      - name: Upload Sauce artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: sauce-report
          path: reports/sauce
          retention-days: 30
