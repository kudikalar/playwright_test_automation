name: Regression

# Full regression: nightly on a schedule, and on demand for a chosen environment.
#
# Shards write Playwright *blob* reports with integrations switched off; one final job merges them
# into a single HTML / JUnit / Extent report and publishes it ONCE to Jira, Zephyr, Slack and email.
# Ten shards therefore produce one Slack message, one email, one Zephyr cycle and no duplicate bugs.
on:
  schedule:
    - cron: "0 20 * * 1-5" # 01:30 IST, weeknights
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [dev, qa, uat]
        default: qa
      publish:
        description: Publish to Jira / Zephyr / Slack / Email
        type: boolean
        default: true

concurrency:
  group: regression-${{ inputs.environment || 'qa' }}
  cancel-in-progress: false

env:
  CI: "true"
  TEST_ENV: ${{ inputs.environment || 'qa' }}
  RETRIES: "2"
  NODE_VERSION: "22"
  # Shards never publish; the merge job does.
  INTEGRATIONS_DISABLED: "true"

jobs:
  api-regression:
    name: API regression
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Run API regression
        run: npx playwright test --project=api --reporter=blob
        env:
          PLAYWRIGHT_BLOB_OUTPUT_NAME: report-api.zip
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          MANAGER_USERNAME: ${{ secrets.MANAGER_USERNAME }}
          MANAGER_PASSWORD: ${{ secrets.MANAGER_PASSWORD }}
          EMPLOYEE_USERNAME: ${{ secrets.EMPLOYEE_USERNAME }}
          EMPLOYEE_PASSWORD: ${{ secrets.EMPLOYEE_PASSWORD }}
          API_KEY: ${{ secrets.API_KEY }}
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: blob-api
          path: blob-report
          retention-days: 3

  ui-regression:
    name: UI regression (${{ matrix.project }} shard ${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit, mobile-chrome, tablet-ipad]
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps
      - name: Run UI regression shard
        run: npx playwright test --project=${{ matrix.project }} --shard=${{ matrix.shard }}/2 --reporter=blob
        env:
          PLAYWRIGHT_BLOB_OUTPUT_NAME: report-${{ matrix.project }}-${{ matrix.shard }}.zip
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          MANAGER_USERNAME: ${{ secrets.MANAGER_USERNAME }}
          MANAGER_PASSWORD: ${{ secrets.MANAGER_PASSWORD }}
          EMPLOYEE_USERNAME: ${{ secrets.EMPLOYEE_USERNAME }}
          EMPLOYEE_PASSWORD: ${{ secrets.EMPLOYEE_PASSWORD }}
          API_KEY: ${{ secrets.API_KEY }}
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: blob-${{ matrix.project }}-${{ matrix.shard }}
          path: blob-report
          retention-days: 3

  merge-and-publish:
    name: Merge reports & publish
    needs: [api-regression, ui-regression]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          pattern: blob-*
          path: all-blob-reports
          merge-multiple: true
      - name: Merge and publish to Jira / Zephyr / Slack / Email
        run: npx playwright merge-reports --config merge.config.ts ./all-blob-reports
        env:
          INTEGRATIONS_DISABLED: ${{ (github.event_name == 'workflow_dispatch' && !inputs.publish) && 'true' || 'false' }}
          REPORT_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # Jira
          JIRA_ENABLED: ${{ vars.JIRA_ENABLED }}
          JIRA_BASE_URL: ${{ vars.JIRA_BASE_URL }}
          JIRA_PROJECT_KEY: ${{ vars.JIRA_PROJECT_KEY }}
          JIRA_ISSUE_KEY_PREFIXES: ${{ vars.JIRA_ISSUE_KEY_PREFIXES }}
          JIRA_CREATE_ISSUE_ON_FAILURE: ${{ vars.JIRA_CREATE_ISSUE_ON_FAILURE }}
          JIRA_BUG_MODE: per-test
          JIRA_NOTE_RECOVERIES: "true"
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          # Zephyr Scale
          ZEPHYR_ENABLED: ${{ vars.ZEPHYR_ENABLED }}
          ZEPHYR_PROJECT_KEY: ${{ vars.ZEPHYR_PROJECT_KEY }}
          ZEPHYR_BASE_URL: ${{ vars.ZEPHYR_BASE_URL }}
          ZEPHYR_TEST_CYCLE_NAME: "Nightly regression ${{ inputs.environment || 'qa' }} run ${{ github.run_number }}"
          ZEPHYR_ENVIRONMENT_NAME: ${{ vars.ZEPHYR_ENVIRONMENT_NAME }}
          ZEPHYR_API_TOKEN: ${{ secrets.ZEPHYR_API_TOKEN }}
          # Slack
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_NOTIFY_ON: always
          # Email
          EMAIL_ENABLED: ${{ vars.EMAIL_ENABLED }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          EMAIL_FROM: ${{ vars.EMAIL_FROM }}
          EMAIL_TO: ${{ vars.EMAIL_TO }}
          EMAIL_CC: ${{ vars.EMAIL_CC }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      - name: Upload merged reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: regression-report
          path: |
            reports/extent
            reports/playwright
            reports/junit
          retention-days: 30
      - name: Job summary
        if: ${{ !cancelled() }}
        run: |
          node -e "
            const fs = require('fs');
            const latest = 'reports/extent/latest.json';
            if (!fs.existsSync(latest)) { console.log('No merged report was produced.'); process.exit(0); }
            const { reportDir, summary: s } = require('./' + latest);
            const model = require(reportDir + '/report.json');
            const out = [
              '## Nightly regression — ${{ inputs.environment || 'qa' }}',
              '| Total | Pass | Fail | Flaky | Skip | Pass rate |', '| ---: | ---: | ---: | ---: | ---: | ---: |',
              '| ' + [s.total, s.passed, s.failed, s.flaky, s.skipped, s.passRate + '%'].join(' | ') + ' |', '',
              '### Integrations', '| Target | Status | Detail |', '| --- | --- | --- |',
              ...(model.integrations || []).map(i => '| ' + i.name + ' | ' + i.status + ' | ' + i.detail.replace(/\|/g, '/') + ' |'),
            ];
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, out.join('\n') + '\n');
          "
